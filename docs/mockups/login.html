<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legion — Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: { colors: { navy: { 950:'#060d1a',900:'#0a1220',800:'#0d1a30',600:'#1e3a5f',500:'#2d4a6a',400:'#4b6a8a' } } } }
}
</script>
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:ui-sans-serif,system-ui,sans-serif;background:#060d1a;color:#e2e8f0;height:100vh;display:flex;align-items:center;justify-content:center;}
  .field-label{font-size:11px;color:#4b6a8a;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;font-weight:600;}
  .field-input{background:#0a1220;border:1px solid #1e3a5f;border-radius:6px;padding:9px 12px;font-size:13px;color:#e2e8f0;width:100%;outline:none;transition:border-color .15s;}
  .field-input:focus{border-color:#22d3ee55;}
  .field-input.active{border-color:#22d3ee55;color:#67e8f9;}
  .btn-primary{width:100%;padding:10px;background:#22d3ee;border-radius:6px;font-size:13px;font-weight:700;color:#060d1a;cursor:pointer;border:none;transition:opacity .15s;}
  .btn-primary:hover{opacity:.9;}
  .error-msg{font-size:11px;color:#f87171;margin-top:6px;display:none;}
  .error-msg.visible{display:block;}
</style>
</head>
<body>

<!-- Background grid hint -->
<div style="position:fixed;inset:0;background-image:radial-gradient(circle at 50% 0%, rgba(34,211,238,.04) 0%, transparent 70%);pointer-events:none;"></div>

<div style="width:340px;position:relative;">

  <!-- Logo -->
  <div style="text-align:center;margin-bottom:32px;">
    <div style="width:40px;height:40px;background:#22d3ee;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#060d1a;margin-bottom:12px;">L</div>
    <div style="font-size:20px;font-weight:700;color:#e2e8f0;letter-spacing:-.01em;">Legion</div>
    <div style="font-size:12px;color:#2d4a6a;margin-top:4px;">Management console</div>
  </div>

  <!-- Card -->
  <div style="background:#0d1a30;border:1px solid #1e3a5f;border-radius:10px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.5);">

    <div style="margin-bottom:18px;">
      <div class="field-label">Name</div>
      <input class="field-input active" type="text" value="admin" autocomplete="username">
    </div>

    <div style="margin-bottom:6px;">
      <div class="field-label">Password</div>
      <input class="field-input" type="password" placeholder="••••••••••••" autocomplete="current-password">
    </div>
    <div class="error-msg" id="errMsg">Incorrect name or password.</div>

    <div style="margin-top:22px;">
      <button class="btn-primary" onclick="showError()">Sign in</button>
    </div>

  </div>

  <!-- Bootstrap hint -->
  <div style="margin-top:16px;text-align:center;font-size:11px;color:#1e3a5f;line-height:1.6;">
    First run? The bootstrap password was printed<br>to the process stdout on startup.
  </div>

</div>

<script>
function showError() {
  document.getElementById('errMsg').classList.toggle('visible');
}
</script>
</body>
</html>
